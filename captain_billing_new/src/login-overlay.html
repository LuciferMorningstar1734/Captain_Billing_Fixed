<!-- ─────────────────────────────────────────────────────────────────────────
     LOGIN OVERLAY — injected into index.html body on load.
     Hidden once user is authenticated.
──────────────────────────────────────────────────────────────────────────── -->
<div id="loginOverlay" style="
  display:flex; position:fixed; inset:0; z-index:9000;
  background:var(--bg); flex-direction:column;
  align-items:center; justify-content:center; gap:28px;
">
  <!-- Logo + brand -->
  <div style="text-align:center;">
    <div style="font-family:var(--font-serif);font-size:32px;font-weight:800;
      color:var(--accent);font-style:italic;letter-spacing:0.5px;">
      Captain Billing
    </div>
    <div style="font-size:16px;color:var(--text-muted);margin-top:6px;font-family:var(--font-body);">
      Sign in to sync your bills across all devices
    </div>
  </div>

  <!-- Google sign-in card -->
  <div style="
    background:var(--surface); border:1px solid var(--border-strong);
    border-radius:14px; padding:32px 36px; width:320px; text-align:center;
    box-shadow:0 24px 64px rgba(0,0,0,0.4);
  ">
    <div style="font-size:42px; margin-bottom:16px;">☁️</div>
    <div style="font-family:var(--font-serif);font-size:19px;font-weight:700;
      color:var(--text);margin-bottom:8px;">
      Cloud Sync Enabled
    </div>
    <div style="font-size:15px;color:var(--text-muted);margin-bottom:24px;line-height:1.7;font-family:var(--font-body);">
      All your bills save to the cloud automatically.<br>
      Sign in with your Google / Gmail account.
    </div>

    <button id="googleSignInBtn" onclick="window.LB_AUTH.signIn()" style="
      display:flex; align-items:center; gap:10px; justify-content:center;
      width:100%; padding:12px 20px; border:none; border-radius:9px;
      background:#fff; color:#333; font-size:17px; font-weight:700;
      cursor:pointer; transition:all 0.2s; box-shadow:0 2px 8px rgba(0,0,0,0.2);
      font-family:var(--font-serif);
    ">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 01-7.18-2.54H1.83v2.07A8 8 0 008.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 010-3.04V5.41H1.83a8 8 0 000 7.18l2.67-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 001.83 5.4L4.5 7.49a4.77 4.77 0 014.48-3.31z"/>
      </svg>
      Sign in with Google
    </button>

    <div id="loginError" style="
      display:none; margin-top:14px; padding:9px 13px; border-radius:7px;
      background:rgba(192,80,74,0.12); color:var(--red);
      font-size:15px; font-family:var(--font-body); text-align:left;
    "></div>

    <div style="margin-top:18px;font-size:14px;color:var(--text-muted);font-style:italic;font-family:var(--font-body);">
      Your data is private and encrypted.<br>Only you can access your bills.
    </div>
  </div>
</div>
